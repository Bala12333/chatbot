<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Crop Advisory</title>
   <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
   <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
   

   <style>
   
</style>
  <style>
    /* ===== Global Styles ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: poppins, sans-serif;
    }

    body {
      height: 100vh;
      background: #EBF2F8;
      color: #333;
      display: flex;
      flex-direction: column;
    }

    /* ===== Header (Logo Container) ===== */
    nav {
      background: #FDFDFD;
      font-family: Poppins, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .logo a {
      text-decoration: none;
      font-weight: bold;
      font-size: 20px;
      color: #2b7a3d;
    }

    /* ===== Layout (Sidebar + Main) ===== */
    .layout {
      flex: 1;
      display: flex;
      height: calc(100vh - 60px); /* remove header height */
    }

    /* ===== Sidebar ===== */
    .sidebar {
      width: 240px;
      background: #DBE4E9;
      box-shadow: 2px 0 5px rgba(0,0,0,0.05);
      padding: 20px 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    .nav {
      list-style: none;
      margin-top: 20px;
    }

    .nav li {
      margin: 10px 0;
    }

    .nav a {
      text-decoration: none;
      color: #373F4C;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      border-radius: 6px;
      transition: all 0.1s;
    }

    .nav a:hover{
      background: #2472CC;
      color: #fff;
    }

    /* ===== Main Content (Centered) ===== */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;  /* vertical center */
      align-items: center;      /* horizontal center */
      text-align: center;
    }

    .main h1 {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 30px;
      color: #373F4C;
    }

    /* ===== Chat Input Section ===== */
    .chatbox {
      width: 100%;
      max-width: 700px;
      display: flex;
      align-items: center;
      border: 2px solid #e0e0e0;
      border-radius: 30px;
      padding: 10px 20px;
      background: #fff;
      box-shadow: 0 2px 7px #2472CC;
      gap: 10px;
    }

    .chatbox input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 16px;
      padding: 8px;
    }

    .chatbox button {
      border: none;
      background: none;
      cursor: pointer;
      font-size: 18px;
      margin-left: 10px;
      color: #2472CC;
    }

    .icon {
      color: #85c3e3;
      cursor: pointer;
      font-size: 20px;
    }

    .icon:hover {
      color: #2472CC;
    }

    a{
        gap: 10px;
    }

    /* ===== Responsive Design ===== */
    @media (max-width: 1024px) {
      .layout {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        flex-direction: row;
        justify-content: space-around;
        box-shadow: none;
        border-bottom: 1px solid #ddd;
      }

      .main {
        padding: 20px;
      }

      .chatbox {
        max-width: 90%;
      }
    }
  </style>
</head>
<body>

  <!-- header -->
  <header>
    <nav>
      <div class="logo"><a href="#">🌱 Smart Crop Advisory</a></div>
    </nav>
  </header>

  <!-- Layout: Sidebar + Main -->
  <div class="layout">
    <!-- ===== Sidebar Section ===== -->
    <div class="sidebar">
      <ul class="nav">
        <li>
        <a href="#" class="active">
            <span class="material-symbols-outlined">dashboard</span>
            Dashboard
        </a>
        </li>
        <li>
        <a href="#">
            <span class="material-symbols-outlined">smart_toy</span>
            Chatbot
        </a>
        </li>
        <li>
        <a href="#">
            <span class="material-symbols-outlined">shopping_cart</span>
            Market Price
        </a>
        </li>
        <li>
        <a href="#">
            <span class="material-symbols-outlined">pest_control</span>
            Pest Detection
        </a>
        </li>
        <li>
        <a href="#">
            <span class="material-symbols-outlined">groups</span>
            Labour Connect
        </a>
        </li>

      </ul>
    </div>

    <!-- ===== Main Content Section ===== -->
    <div class="main">
      <h1>Hi there! How can I<br> help you today?</h1>

      <!-- Chat Input -->
      <div class="chatbox">
        <span class="icon">+</span>
        <input type="text" placeholder="Ask me anything...">
        <span class="icon" onclick="sendMessage()"><span class="material-symbols-outlined">mic</span></span>
        <span class="icon" onclick="sendMessage()"><span class="material-symbols-outlined">graphic_eq</span></span>
      </div>
    </div>
  </div>

  <!-- ===== JavaScript (optional for interactivity) ===== -->
  <script>
    // Example: Add active class to clicked nav item
    const navLinks = document.querySelectorAll('.nav a');
    navLinks.forEach(link => {
      link.addEventListener('click', () => {
        navLinks.forEach(l => l.classList.remove('active'));
        link.classList.add('active');
      });
    });
  </script>

</body>
</html>
